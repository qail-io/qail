[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "lsp",
    "encoder",
    "pg",
    "qdrant",
    "gateway",
    "workflow",
    "workflow-postgres",
    "mcp",
]
exclude = [
    "pg/fuzz",
    "core/fuzz",
    "codegen",
]

[workspace.lints.rust]
warnings = "deny"
unused = "deny"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[profile.release]
strip = true       # Remove debug symbols (~240MB savings)
lto = true          # Link-time optimization (smaller + faster)
codegen-units = 1   # Better optimization (slower compile)

# WASM builds for the remote MCP server (qail-wasm). Must live here: profile
# sections declared in workspace members are silently ignored by Cargo.
[profile.wasm-release]
inherits = "release"
opt-level = "z"     # Optimize for size over speed (edge bundle budget)
panic = "abort"     # No unwinding tables in wasm

# For profiling, use: cargo build --profile release-with-debug
[profile.release-with-debug]
inherits = "release"
strip = false
debug = true
lto = false
