[package]
name = "qail-core"
version = "1.3.5"
edition = "2024"
description = "QAIL AST Kernel - typed query AST, schema validation, RLS context, and native access policy"
license = "Apache-2.0"
repository = "https://github.com/qail-io/qail"
homepage = "https://dev.qail.io"
documentation = "https://docs.rs/qail-core"
readme = "README.md"
categories = ["database", "parser-implementations"]
keywords = ["qail", "ast", "postgres", "rls", "schema"]

[features]
default = []
analyzer = []
# Internal-only: enables examples that depend on external crates (qail-pg, bytes).
# Never used in normal builds — only for manual `cargo run --example`.
_pg_examples = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
nom = "8"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# `v4` is deliberately absent: it pulls getrandom, which has no
# wasm32-unknown-unknown backend and would break the qail-wasm build. qail-core
# uses Uuid only as a type and never generates one. Crates that do generate
# UUIDs (gateway, pg, qdrant) enable `v4` themselves.
uuid = { version = "1", features = ["serde"] }
strsim = "0.11"
toml = "1.1"

[dev-dependencies]
proptest = "1.11.0"
# Examples and tests may generate UUIDs; this never reaches the wasm build.
uuid = { version = "1", features = ["serde", "v4"] }

[[example]]
name = "test_multiline_sql"
required-features = ["analyzer"]

# This example depends on qail-pg (external crate); gated behind _pg_examples
# so it is excluded from `cargo test -p qail-core`.
[[example]]
name = "test_subquery_sql2"
required-features = ["_pg_examples"]

[lints]
workspace = true
