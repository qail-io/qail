[package]
name = "qail-wasm"
version = "1.3.5"
edition = "2024"
description = "WebAssembly build of the QAIL MCP server for edge deployment"
license = "Apache-2.0"
repository = "https://github.com/qail-io/qail"
homepage = "https://dev.qail.io"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The boundary is String -> String, so no serde-wasm-bindgen or js-sys is
# needed. Everything above this layer is qail-mcp's own dispatch.
[dependencies]
wasm-bindgen = "0.2"
qail-mcp = { path = "../mcp", version = "1.3.5" }

[lints]
workspace = true
